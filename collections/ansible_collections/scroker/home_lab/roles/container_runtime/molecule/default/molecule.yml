---
driver:
  name: podman

platforms:
  - name: instance
    image: quay.io/fedora/fedora:42
    pre_build_image: true
    systemd: always
    command: /usr/sbin/init
    privileged: true
    capabilities:
      - SYS_ADMIN
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

provisioner:
  name: ansible
  env:
    ANSIBLE_COLLECTIONS_PATHS: "${MOLECULE_PROJECT_DIRECTORY}/../../../../../"
  config_options:
    defaults:
      interpreter_python: auto_silent

verifier:
  name: ansible
